<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  {% seo %}
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="header-container">
      <a class="site-brand" href="{{ '/' | relative_url }}">
        <span class="brand-title">{{ site.title }}</span>
        {% if site.description %}<span class="brand-subtitle">{{ site.description }}</span>{% endif %}
      </a>
      
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" class="nav-link">首页</a>
        <a href="{{ '/archive.html' | relative_url }}" class="nav-link">归档</a>
        <a href="{{ '/about.html' | relative_url }}" class="nav-link">关于</a>
      </nav>
    </div>
  </header>

  <!-- Hero / Banner Header -->
  <div class="hero-banner">
    <div class="hero-content">
      <h1 class="hero-title">{{ site.title }}</h1>
      <p class="hero-tagline">{{ site.description }} &bull; Luppiter 的随想与笔记</p>
    </div>
  </div>

  <!-- Main Container -->
  <main class="main-container">
    <div class="content-wrapper">
      {{ content }}
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}. Powered by GitHub Pages & Jekyll.</p>
    </div>
  </footer>

</body>
</html>
