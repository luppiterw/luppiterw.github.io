---
layout: default
---

<article class="post-detail-card">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <span class="post-date">📅 {{ page.date | date: "%Y-%m-%d" }}</span>
      {% if page.categories.size > 0 %}
        <span class="meta-sep">&bull;</span>
        <span class="post-cats">📁 {{ page.categories | join: ", " }}</span>
      {% endif %}
      {% if page.tags.size > 0 %}
        <span class="meta-sep">&bull;</span>
        <span class="post-tags">🏷️ {{ page.tags | join: ", " }}</span>
      {% endif %}
    </div>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}" class="back-link">&larr; 返回文章列表</a>
  </footer>
</article>
